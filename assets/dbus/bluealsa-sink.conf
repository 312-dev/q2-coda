<!-- Guest Play's second BlueALSA daemon, "bluealsa -B sink -p a2dp-sink", which q2-guest starts
     (docs/internals.md#the-relay): stock's bluealsa.conf lets root own org.bluealsa.* but reach
     only org.bluealsa, so bluealsa-aplay and q2-guest could not call this one. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.bluealsa.sink"/>
    <allow send_destination="org.bluealsa.sink"/>
  </policy>
</busconfig>
