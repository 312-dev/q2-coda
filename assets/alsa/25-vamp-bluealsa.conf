# Vamp's Bluetooth launcher (patch/bt_launch.sh) points these links at stock's bluealsa plugins or at Vamp's own,
# for whichever daemon it started last, so a client that opens `bluealsa` speaks that daemon's interface.
pcm_type.bluealsa {
	lib "/tmp/q2-bt/libasound_module_pcm_bluealsa.so"
}
ctl_type.bluealsa {
	lib "/tmp/q2-bt/libasound_module_ctl_bluealsa.so"
}
