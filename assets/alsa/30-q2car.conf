# The car's other sources (docs/iphone-mode.md#other-sources-over-usb, tools/build.py CAR_FEED_CONF): while Car Audio
# takes the audio, demo names this device to q2video and librespot's sink (patch/videos.c output_device). Their sound,
# made 44.1 kHz, 16-bit stereo here, goes as raw frames into the player's FIFO (player/feed.c), and the player, the car
# card's one owner, writes it to the car. The null slave takes the frames at once; the FIFO paces the source.
pcm.q2car {
    type plug
    slave {
        pcm "q2car_feed"
        rate 44100
        format S16_LE
        channels 2
    }
}
pcm.q2car_feed {
    type file
    slave.pcm "null"
    file "/tmp/q2car.feed"
    format "raw"
}
