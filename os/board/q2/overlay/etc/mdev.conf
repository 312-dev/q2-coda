# mdev's rules (BusyBox). No module loading here: the modules are loaded by path from /vendor (rcS).
null		root:root 666
zero		root:root 666
full		root:root 666
random		root:root 444
urandom		root:root 444
console		root:tty 600
ptmx		root:tty 666
tty		root:tty 666
tty[0-9]*	root:tty 660
ttyS[0-9]*	root:root 660
snd/.*		root:audio 660
input/event[0-9]+	root:root 640
fb[0-9]+	root:video 660
mtd[0-9]+.*	root:root 600
ubi.*		root:root 600
# the card: mounted on /mnt/mmc when it comes and unmounted when it goes, as stock's add_removesd.sh does
mmcblk[0-9]+p[0-9]+	root:root 660 */etc/mdev/card
mmcblk[0-9]+	root:root 660 */etc/mdev/card
