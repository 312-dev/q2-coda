# bluetoothd's settings in Vamp OS (docs/vamp-os-base.md#bluetooth): Vamp's values for the keys today's Vamp edits
# in stock's file (tools/build.py BT_NAME, BT_DISCOVERABLE, BT_EXPERIMENTAL, BT_GATT_SERVER), stock's for the rest
# of what it sets; everything else is upstream's default.
[General]
Name = Vamp
Class = 0x20041C
DiscoverableTimeout = 180
Experimental = true

[Policy]
ReconnectAttempts = 4
ReconnectIntervals = 20,20,20,20

[GATT]
# no GATT server and no LE advertising manager: coda-rc serves the LE attribute channel (docs/bluez.md)
Server = false
